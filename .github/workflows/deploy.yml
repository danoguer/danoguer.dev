name: danoguer.dev pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  verification:
    runs-on: ubuntu-latest

    steps:
    - name: Clone Repo
      uses: actions/checkout@v4
      with:
          fetch-depth: 0

    - name: Validate commits format
      uses: wagoid/commitlint-github-action@v6

    - name: Install and execute HTMLHint
      run: |
        npm install -g htmlhint
        htmlhint "**/*.html"

    - name: Validate links and images
      uses: lycheeverse/lychee-action@v2
      with:
        args: --verbose --no-progress --exclude 'linkedin\.com' './**/*.html'
      env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
