name: danoguer.dev pipeline

on:
  push:
    branches: [ "main" ]

permissions:
  id-token: write
  contents: read

jobs:
  verification:
    runs-on: ubuntu-latest

    steps:
    - name: Clone Repo
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Validate commits format
      uses: wagoid/commitlint-github-action@v6

    - name: Install and execute HTMLHint
      run: |
        npm install -g htmlhint
        htmlhint "**/*.html" --rules "src-not-empty=false"

    - name: Validate links and images
      uses: lycheeverse/lychee-action@v2
      with:
        args: --verbose --no-progress --exclude 'linkedin\.com' './**/*.html'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'

    - name: Build Lambda Binary
      run: |
        GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -o bootstrap main.go
      working-directory: ./lambda

    - name: Configure AWS Credentials via OIDC
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
        aws-region: eu-west-1

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3

    - name: Terraform Init
      run: terraform init
      working-directory: ./terraform

    - name: Terraform Plan
      run: terraform plan
      working-directory: ./terraform
